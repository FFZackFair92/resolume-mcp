name: CI

on:
  push:
  pull_request:

jobs:
  controlli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "mcp>=1.2,<2" "httpx>=0.27" ruff
      - name: Errori veri (sintassi, nomi non definiti)
        run: ruff check --isolated --select E9,F63,F7,F82 .
      - name: Il server si carica e registra i tool
        run: python check_mcp.py
